# Try out a clean installation of this configuration bundle on a
# couple of Emacs versions.  Installation also evaluates most of the
# elisp code used so it's an indication of everything working.

name: Build

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - README.org
  push:
    branches:
      - main
    paths-ignore:
      - README.org

jobs:

  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        emacs_version:
          - 29.4
          - 30.1
          - snapshot
    env:
      EMACS_ENABLE_ALL_MODULES: "true"

    steps:

      - name: Setup Emacs
        uses: purcell/setup-emacs@bdc64dc730ae1fcba200bfd52cb1b4cf6159cbe5 # v8.0
        with:
          version: ${{ matrix.emacs_version }}
    
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    
      - name: Install dependencies
        run: make install
